# Daily recipe worker. Generates one recipe with its photo, checks it, and
# saves it for review or, in automatic mode, publishes it and then posts its
# Pinterest Pin once the recipe page is confirmed live.
#
# Runs every day at 02:00 UTC (09:00 Asia/Bangkok) in automatic mode, and can
# still be started by hand (Actions -> Daily recipe -> Run workflow). At most
# one daily recipe per UTC date. Nothing runs unless the AUTOMATION_ENABLED
# variable is "true" AND automation is switched on in the admin dashboard; a
# scheduled run publishes only when Admin -> Automation is in Automatic mode
# (otherwise it saves a draft for review). Pins are only
# posted automatically when Admin -> Automation also has Automatic mode and
# "Post Pins automatically" on. Dry runs work while automation is off, never
# save a recipe and never post a Pin.

name: Daily recipe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run: test without saving a recipe. review: save a draft for approval. auto: publish, then post its Pin (only after 5 approved recipes)."
        type: choice
        options: [dry_run, review, auto]
        default: dry_run
      keyword:
        description: "Dry runs only: a keyword to try instead of the next one in the queue (optional)."
        type: string
        required: false
      resume_job_id:
        description: "Review runs only: finish this failed job from its corrected draft (see docs/AUTOMATION.md, Recovering a rejected draft). Leave empty normally."
        type: string
        required: false
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 09:00 Asia/Bangkok, every day. GitHub may start it a little late.

permissions:
  contents: read

concurrency:
  group: daily-recipe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: automation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the recipe
        run: npm run automation:run
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRY_RUN_KEYWORD: ${{ inputs.keyword }}
          RESUME_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_job_id || '' }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Same values as in Vercel. Used only to post Pins automatically.
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_TOKEN_ENCRYPTION_KEY: ${{ secrets.PINTEREST_TOKEN_ENCRYPTION_KEY }}
